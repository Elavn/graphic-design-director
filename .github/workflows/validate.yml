name: Validate Graphic Design Director
on:
  push:
  pull_request:
jobs:
  skill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/graphic-design-director
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_skill.py
      - run: python scripts/install.py --target all --scope project --project /tmp/gdd-smoke --dry-run
      - run: python -m pip install -r requirements-pipeline.txt
      - run: python -m unittest discover -s tests -v
